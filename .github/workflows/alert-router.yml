name: Alert Router (Research Only)

# Research-only alert router.
# Routes a previously ingested alert based on its next_step value.
# Never places orders. Never enables paper execution.
# Never passes --approve-paper to generate_trade_plan.py.

on:
  workflow_dispatch:
    inputs:
      alert_id:
        description: >
          alert_id of the alert file to route (e.g. tv-20260512-aapl-001).
          Leave blank to route the most recently ingested alert.
        required: false
        type: string
        default: ""
      run_pipeline:
        description: >
          For request_trade_plan_unapproved alerts: invoke scan_triggers.py
          then generate_trade_plan.py (no --approve-paper).
          Ignored for other next_step values.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trading-os-main
  cancel-in-progress: false

jobs:
  alert-router:
    runs-on: ubuntu-latest

    env:
      # Execution is explicitly disabled — this workflow has no execution path.
      ENABLE_PAPER_EXECUTION: "false"
      LIVE_TRADING_CONFIRMED: "false"
      TRADING_MODE: paper
      ALPACA_PAPER: "true"
      # Alpaca keys are only needed when run_pipeline=true (for refresh_data / scan_triggers).
      # They are not needed for log_only, request_alert_review, or request_data_refresh.
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Route alert (by alert_id)
        if: ${{ inputs.alert_id != '' }}
        run: |
          ALERT_FILE="data/history/alerts/alert-${{ inputs.alert_id }}.json"
          PIPELINE_FLAG=""
          if [ "${{ inputs.run_pipeline }}" = "true" ]; then
            PIPELINE_FLAG="--run-pipeline"
          fi
          python scripts/route_alert.py --alert-file "$ALERT_FILE" $PIPELINE_FLAG

      - name: Route alert (latest)
        if: ${{ inputs.alert_id == '' }}
        run: |
          PIPELINE_FLAG=""
          if [ "${{ inputs.run_pipeline }}" = "true" ]; then
            PIPELINE_FLAG="--run-pipeline"
          fi
          python scripts/route_alert.py --latest $PIPELINE_FLAG

      - name: Commit routing artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/alerts memory/TRIGGER-LOG.md memory/SIGNAL-LOG.md
          git diff --cached --quiet || git commit -m "research: route alert run=${{ github.run_id }}"
          git push
