name: Alert Router (Research Only)

# Research-only alert router.
# Routes a previously ingested alert based on its next_step value.
#
# Safety invariants hardcoded in this workflow:
#   ENABLE_PAPER_EXECUTION=false  — execution is never possible from this path
#   LIVE_TRADING_CONFIRMED=false  — live trading is never confirmed here
#   --approve-paper is never passed to generate_trade_plan.py
#   execute_paper.py is never called

on:
  workflow_dispatch:
    inputs:
      alert_id:
        description: >
          alert_id of the alert to route (e.g. tv-20260512-aapl-001).
          Leave blank to route the most recently ingested alert (--latest).
        required: false
        type: string
        default: ""
      latest:
        description: >
          Route the most recently ingested alert (ignored when alert_id is set).
        required: false
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      route_mode:
        description: >
          record_only: write route record and logs, no scripts.
          run_refresh: also run refresh_data.py + monitor_positions.py.
          run_unapproved_plan: run full pipeline (no --approve-paper).
          Incompatible modes for the alert next_step are rejected.
        required: false
        type: choice
        default: record_only
        options:
          - record_only
          - run_refresh
          - run_unapproved_plan

permissions:
  contents: write

concurrency:
  group: trading-os-main
  cancel-in-progress: false

jobs:
  alert-router:
    runs-on: ubuntu-latest

    env:
      # Execution is explicitly and permanently disabled in this workflow.
      ENABLE_PAPER_EXECUTION: "false"
      LIVE_TRADING_CONFIRMED: "false"
      TRADING_MODE: paper
      ALPACA_PAPER: "true"
      ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}
      # Alpaca keys are required only when route_mode is run_refresh or run_unapproved_plan
      # (for refresh_data.py / scan_triggers.py). They are never used for order submission.
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Safety preflight (never executes orders)
        run: |
          if [ "$ENABLE_PAPER_EXECUTION" = "true" ]; then
            echo "::error::ENABLE_PAPER_EXECUTION must not be true in alert-router workflow"
            exit 1
          fi
          if [ "$LIVE_TRADING_CONFIRMED" = "true" ]; then
            echo "::error::LIVE_TRADING_CONFIRMED must not be true"
            exit 1
          fi
          if [ "$TRADING_MODE" != "paper" ]; then
            echo "::error::TRADING_MODE must be paper"
            exit 1
          fi
          echo "Safety preflight passed: ENABLE_PAPER_EXECUTION=false LIVE_TRADING_CONFIRMED=false TRADING_MODE=paper"

      - name: Route alert
        run: |
          if [ -n "${{ inputs.alert_id }}" ]; then
            ALERT_FLAG="--alert-id ${{ inputs.alert_id }}"
          else
            ALERT_FLAG="--latest"
          fi
          python scripts/route_alert.py \
            $ALERT_FLAG \
            --route-mode "${{ inputs.route_mode }}"

      - name: Run validate_all
        run: python scripts/validate_all.py

      - name: Commit routing artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/history/alerts/routes/ \
            memory/TRIGGER-LOG.md \
            memory/SIGNAL-LOG.md \
            memory/RESEARCH-CONTEXT.md \
            || true

          # Also commit data/latest/ if modified (run_refresh or run_unapproved_plan)
          if ! git diff --cached --quiet data/latest/ 2>/dev/null; then
            git add data/latest/ || true
          fi

          # Also commit memory/DATA-QUALITY-LOG.md if modified
          git add memory/DATA-QUALITY-LOG.md 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No routing artifacts changed."
          else
            git commit -m "research: alert router run=${{ github.run_id }} mode=${{ inputs.route_mode }}"
            git pull --rebase origin main
            git push
          fi
