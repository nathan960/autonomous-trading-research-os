name: Trigger Scan → Trade Plan → Dry-Run

on:
  schedule:
    # 09:45 ET weekdays (14:45 UTC) — after market open
    - cron: "45 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest

    env:
      TRADING_MODE: paper
      ALPACA_PAPER: "true"
      ENABLE_PAPER_EXECUTION: "false"
      LIVE_TRADING_CONFIRMED: "false"
      ALPACA_DATA_FEED: iex

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall src scripts tests

      - name: Validate configs
        run: python scripts/validate_all.py

      - name: Scan triggers
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python scripts/scan_triggers.py

      - name: Generate trade plan (approve for paper)
        run: python scripts/generate_trade_plan.py --approve-paper

      - name: Dry-run execution gates
        run: python scripts/dry_run_execute.py

      - name: Monitor positions
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python scripts/monitor_positions.py

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --ff-only
          git add \
            data/latest/ \
            data/history/triggers/ \
            data/history/executions/ \
            data/history/portfolio/ \
            memory/ || true
          git commit -m "routine/trigger-plan-dryrun: $(date -u +%Y%m%dT%H%M%SZ)" || true
          git push
