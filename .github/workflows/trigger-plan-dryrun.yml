name: Trigger Plan Dry Run

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 15:15 UTC.
    # Scripts must still fail closed on stale data, market state, and risk gates.
    - cron: "15 15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: trading-os-main
  cancel-in-progress: false

jobs:
  trigger-plan-dryrun:
    runs-on: ubuntu-latest

    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      TRADING_MODE: paper
      ALPACA_PAPER: "true"
      ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED }}
      ENABLE_PAPER_EXECUTION: "false"
      LIVE_TRADING_CONFIRMED: "false"

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh data
        run: python scripts/refresh_data.py

      - name: Monitor positions and risk state
        run: python scripts/monitor_positions.py

      - name: Scan triggers
        run: python scripts/scan_triggers.py

      - name: Generate trade plan
        run: python scripts/generate_trade_plan.py

      - name: Dry-run execution
        run: python scripts/dry_run_execute.py

      - name: Validate
        run: python scripts/validate_all.py

      - name: Commit dry-run artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Git status before staging:"
          git status --short

          git add -A data memory

          echo "Git status after staging:"
          git status --short

          if git diff --cached --quiet; then
            echo "No dry-run artifacts changed."
          else
            git commit -m "chore(run): trigger plan dry-run ${{ github.run_id }}"
          fi

          git pull --rebase --autostash origin main
          git push