name: Order Monitor

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use stored snapshots instead of fetching live from Alpaca?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  # Run near US market close on trading days (Mon-Fri 20:30 UTC = 4:30 PM ET)
  schedule:
    - cron: "30 20 * * 1-5"

permissions:
  contents: write

concurrency:
  group: trading-os-main
  cancel-in-progress: false

jobs:
  order-monitor:
    runs-on: ubuntu-latest

    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      TRADING_MODE: paper
      ALPACA_PAPER: "true"
      ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}
      # Execution is never called from this workflow — hardcoded false as proof.
      ENABLE_PAPER_EXECUTION: "false"
      LIVE_TRADING_CONFIRMED: "false"

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify safety mode (never executes orders)
        run: |
          if [ "$ENABLE_PAPER_EXECUTION" = "true" ]; then
            echo "::error::ENABLE_PAPER_EXECUTION must not be true in order-monitor workflow"
            exit 1
          fi
          if [ "$LIVE_TRADING_CONFIRMED" = "true" ]; then
            echo "::error::LIVE_TRADING_CONFIRMED must not be true"
            exit 1
          fi
          if [ "$TRADING_MODE" != "paper" ]; then
            echo "::error::TRADING_MODE must be paper"
            exit 1
          fi
          echo "Safety mode verified: ENABLE_PAPER_EXECUTION=false, LIVE_TRADING_CONFIRMED=false"

      - name: Run order monitor
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python scripts/monitor_orders.py $DRY_RUN_FLAG

      - name: Commit order monitor artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest/order_monitor_report.json \
                  data/history/orders/ \
                  memory/TRADE-LOG.md \
                  || true

          if git diff --cached --quiet; then
            echo "No order monitor artifacts changed."
          else
            git commit -m "chore(orders): order monitor run ${{ github.run_id }}"
            git pull --rebase origin main
            git push
          fi
