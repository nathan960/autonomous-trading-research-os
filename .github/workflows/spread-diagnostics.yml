name: Spread Gate Diagnostics

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 15:30 UTC (during US market hours, ~30 min after open).
    # Running during market hours gives valid IEX quotes for spread evaluation.
    - cron: "30 15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: trading-os-main
  cancel-in-progress: false

jobs:
  spread-diagnostics:
    runs-on: ubuntu-latest

    env:
      TRADING_MODE: paper
      ALPACA_PAPER: "true"
      ENABLE_PAPER_EXECUTION: "false"
      LIVE_TRADING_CONFIRMED: "false"

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall src scripts tests

      - name: Refresh market data
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED }}
        run: python scripts/refresh_data.py

      - name: Diagnose spreads
        run: python scripts/diagnose_spreads.py

      - name: Commit diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Git status before staging:"
          git status --short

          git add -A data memory
          git restore --staged data/sandbox memory/sandbox 2>/dev/null || true

          echo "Git status after staging:"
          git status --short

          if git diff --cached --quiet; then
            echo "No spread diagnostics artifacts changed."
          else
            git commit -m "chore(run): spread-diagnostics ${{ github.run_id }}"
          fi

          git pull --rebase --autostash origin main
          git push
