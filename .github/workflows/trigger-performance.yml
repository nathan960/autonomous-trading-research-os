name: Trigger Performance Scorer (Research Only)

# Research-only trigger performance scorer.
# Aggregates trigger scan history, fill records, and outcome snapshots to
# produce per-trigger performance statistics.
#
# Safety invariants hardcoded in this workflow:
#   ENABLE_PAPER_EXECUTION=false  — execution is never possible from this path
#   LIVE_TRADING_CONFIRMED=false  — live trading is never confirmed here
#   execute_paper.py is never called
#   strategy.json, risk_limits.json are never written
#   trade plans are never approved
#   orders are never submitted, cancelled, or replaced

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 21:30 UTC — after outcome-tracker (21:15).
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: trading-os-main
  cancel-in-progress: false

jobs:
  score-triggers:
    runs-on: ubuntu-latest

    env:
      ENABLE_PAPER_EXECUTION: "false"
      LIVE_TRADING_CONFIRMED: "false"
      TRADING_MODE: paper

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Safety preflight
        run: |
          if [ "$ENABLE_PAPER_EXECUTION" = "true" ]; then
            echo "::error::ENABLE_PAPER_EXECUTION must not be true in trigger-performance workflow"
            exit 1
          fi
          if [ "$LIVE_TRADING_CONFIRMED" = "true" ]; then
            echo "::error::LIVE_TRADING_CONFIRMED must not be true"
            exit 1
          fi
          echo "Safety preflight passed: ENABLE_PAPER_EXECUTION=false LIVE_TRADING_CONFIRMED=false"

      - name: Score triggers
        run: python scripts/score_triggers.py --days 7

      - name: Commit performance artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Git status before staging:"
          git status --short

          git add -A data/latest/trigger_performance.json \
                     data/history/trigger_performance \
                     memory/EXPERIMENT-LOG.md

          echo "Git status after staging:"
          git status --short

          if git diff --cached --quiet; then
            echo "No trigger performance artifacts changed."
          else
            git commit -m "research: trigger performance run=${{ github.run_id }}"
          fi

          git pull --rebase --autostash origin main
          git push
