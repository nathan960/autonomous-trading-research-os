name: Alert Intake (Research Only)

# Research-only external alert intake.
# Never places orders. Never enables paper execution.
# Ingests a single JSON alert payload, writes to data/history/alerts/,
# appends to memory/TRIGGER-LOG.md, and commits.

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON alert payload (see docs/WEBHOOKS.md for schema)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: trading-os-main
  cancel-in-progress: false

jobs:
  alert-intake:
    runs-on: ubuntu-latest

    env:
      # Execution is explicitly disabled — this workflow has no execution path.
      ENABLE_PAPER_EXECUTION: "false"
      LIVE_TRADING_CONFIRMED: "false"
      TRADING_MODE: paper
      # No Alpaca keys needed — this workflow does not call the broker API.

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest alert
        run: |
          python scripts/ingest_alert.py --payload '${{ inputs.payload }}'

      - name: Commit event files (conflict-free)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/history/events/
          if git diff --cached --quiet; then
            echo "No event files to commit."
          else
            git commit -m "chore(events): alert-intake ${{ github.run_id }}"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Commit remaining alert artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Git status before staging:"
          git status --short

          git add -A data memory
          git restore --staged data/history/events/ 2>/dev/null || true

          echo "Git status after staging:"
          git status --short

          if git diff --cached --quiet; then
            echo "No remaining alert artifacts changed."
            exit 0
          fi

          git commit -m "research: ingest external alert run=${{ github.run_id }}"

          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            echo "::warning::Markdown conflict during rebase. Event JSON files already pushed. Run rebuild_memory_logs.py to regenerate memory logs."
            exit 1
          fi
          git push
