name: Paper Execution

# DEPRECATED — use Manual Paper Cycle instead.
#
# This standalone workflow is superseded by manual-paper-cycle.yml, which
# provides the same paper execution path with a unified research pipeline,
# post-trade reconciliation, and a cleaner one-click interface.
#
# This file is kept in version control for historical reference only.
# All triggers are blocked by the deprecation step below.
#
# To submit Alpaca paper orders, trigger:
#   Manual Paper Cycle  →  cycle_mode=paper_execution

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-os-main
  cancel-in-progress: false

jobs:
  paper-execution:
    runs-on: ubuntu-latest

    env:
      TRADING_MODE: paper
      ENABLE_PAPER_EXECUTION: "false"
      LIVE_TRADING_CONFIRMED: "false"

    steps:
      - name: Deprecation block
        run: |
          echo "::error::This workflow is deprecated."
          echo "::error::Use the 'Manual Paper Cycle' workflow (manual-paper-cycle.yml) instead."
          echo "::error::Trigger it with cycle_mode=paper_execution, approve_paper_plan=true,"
          echo "::error::and confirm_manual_paper_execution=PAPER."
          echo ""
          echo "This file is kept for historical reference. No scripts are run from this path."
          exit 1
