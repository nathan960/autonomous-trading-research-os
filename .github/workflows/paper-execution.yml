name: Paper Execution

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-os-main
  cancel-in-progress: false

jobs:
  paper-execution:
    runs-on: ubuntu-latest

    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      TRADING_MODE: paper
      ALPACA_PAPER: "true"
      ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED }}
      ENABLE_PAPER_EXECUTION: ${{ vars.ENABLE_PAPER_EXECUTION }}
      LIVE_TRADING_CONFIRMED: "false"

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh data
        run: python scripts/refresh_data.py

      - name: Monitor positions and risk state
        run: python scripts/monitor_positions.py

      - name: Scan triggers
        run: python scripts/scan_triggers.py

      - name: Generate trade plan
        run: python scripts/generate_trade_plan.py

      - name: Execute paper plan
        run: python scripts/execute_paper.py --confirm-paper

      - name: Commit execution artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data memory
          git diff --cached --quiet || git commit -m "chore(exec): paper execution attempt ${{ github.run_id }}"
          git push