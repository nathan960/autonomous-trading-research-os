name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      TRADING_MODE: paper
      ALPACA_PAPER: "true"
      ENABLE_PAPER_EXECUTION: "false"
      LIVE_TRADING_CONFIRMED: "false"

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall src scripts tests

      - name: Validate configs
        run: python scripts/validate_all.py

      - name: Run test suite
        run: python -m pytest --tb=short -q
