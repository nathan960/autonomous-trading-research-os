name: Data Refresh

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 15:05 UTC.
    # Scripts must still use Alpaca market clock and fail closed when needed.
    - cron: "5 15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: trading-os-main
  cancel-in-progress: false

jobs:
  data-refresh:
    runs-on: ubuntu-latest

    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      TRADING_MODE: paper
      ALPACA_PAPER: "true"
      ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED }}
      ENABLE_PAPER_EXECUTION: "false"
      LIVE_TRADING_CONFIRMED: "false"

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh data
        run: python scripts/refresh_data.py

      - name: Monitor positions and risk state
        run: python scripts/monitor_positions.py

      - name: Validate
        run: python scripts/validate_all.py --execution-check

      - name: Commit data and memory artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Git status before staging:"
          git status --short

          git add -A data memory
          # Never commit sandbox files — dry-run outputs stay local only
          git restore --staged data/sandbox memory/sandbox 2>/dev/null || true

          echo "Git status after staging:"
          git status --short

          if git diff --cached --quiet; then
            echo "No data artifacts changed."
          else
            git commit -m "chore(data): refresh snapshots and risk state ${{ github.run_id }}"
          fi

          git pull --rebase --autostash origin main
          git push