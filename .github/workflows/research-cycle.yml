name: Research Cycle

# One-click full research pipeline: data refresh → monitoring → trade plan
# (unapproved) → dry-run gates → outcome tracking → lineage → trigger scoring
# → daily summary → validation → artifact commit.
#
# Safety invariants hardcoded in this workflow:
#   ENABLE_PAPER_EXECUTION=false  — execution is never possible from this path
#   LIVE_TRADING_CONFIRMED=false  — live trading is never confirmed here
#   execute_paper.py is never called
#   --approve-paper is never passed to generate_trade_plan.py
#   trade plans are produced but approval.approved_for_execution remains false

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 20:45 UTC — after US market close, before daily-summary (21:00).
    - cron: "45 20 * * 1-5"

permissions:
  contents: write

concurrency:
  group: trading-os-main
  cancel-in-progress: false

jobs:
  research-cycle:
    runs-on: ubuntu-latest

    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      TRADING_MODE: paper
      ALPACA_PAPER: "true"
      ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}
      ENABLE_PAPER_EXECUTION: "false"
      LIVE_TRADING_CONFIRMED: "false"

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Safety preflight
        run: |
          if [ "$ENABLE_PAPER_EXECUTION" = "true" ]; then
            echo "::error::ENABLE_PAPER_EXECUTION must not be true in research-cycle workflow"
            exit 1
          fi
          if [ "$LIVE_TRADING_CONFIRMED" = "true" ]; then
            echo "::error::LIVE_TRADING_CONFIRMED must not be true"
            exit 1
          fi
          if [ "$TRADING_MODE" != "paper" ]; then
            echo "::error::TRADING_MODE must be paper"
            exit 1
          fi
          echo "Safety preflight passed: ENABLE_PAPER_EXECUTION=false LIVE_TRADING_CONFIRMED=false TRADING_MODE=paper"

      - name: Refresh data
        run: python scripts/refresh_data.py

      - name: Monitor positions and risk state
        run: python scripts/monitor_positions.py

      - name: Monitor orders
        run: python scripts/monitor_orders.py

      - name: Scan triggers
        run: python scripts/scan_triggers.py

      - name: Generate trade plan (unapproved)
        run: python scripts/generate_trade_plan.py

      - name: Dry-run execution gates
        run: python scripts/dry_run_execute.py

      - name: Track outcomes
        run: python scripts/track_outcomes.py

      - name: Build lineage
        run: python scripts/build_lineage.py

      - name: Score triggers
        run: python scripts/score_triggers.py

      - name: Daily summary
        run: python scripts/daily_summary.py

      - name: Validate
        run: python scripts/validate_all.py

      - name: Commit event files (conflict-free)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/history/events/
          if git diff --cached --quiet; then
            echo "No event files to commit."
          else
            git commit -m "chore(events): research-cycle ${{ github.run_id }}"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Commit research artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Git status before staging:"
          git status --short

          git add -A data memory
          git restore --staged data/history/events/ 2>/dev/null || true
          git restore --staged data/sandbox memory/sandbox 2>/dev/null || true

          echo "Git status after staging:"
          git status --short

          if git diff --cached --quiet; then
            echo "No research artifacts changed."
            exit 0
          fi

          git commit -m "research: research-cycle run=${{ github.run_id }}"

          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            echo "::warning::Markdown conflict during rebase. Event JSON files already pushed. Run rebuild_memory_logs.py to regenerate memory logs."
            exit 1
          fi

          git push
