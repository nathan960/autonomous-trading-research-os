name: Outcome Tracker (Research Only)

# Research-only outcome tracker.
# Reads filled order data from order_monitor_report and positions/market
# snapshots, builds per-order outcome records, and writes to
# data/latest/outcome_snapshot.json, data/history/outcomes/, and memory/.
#
# Safety invariants hardcoded in this workflow:
#   ENABLE_PAPER_EXECUTION=false  — execution is never possible from this path
#   LIVE_TRADING_CONFIRMED=false  — live trading is never confirmed here
#   execute_paper.py is never called
#   trade plans are never approved
#   orders are never submitted, cancelled, or replaced

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 21:15 UTC — after order-monitor (20:30) and daily-summary (21:00).
    - cron: "15 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: trading-os-main
  cancel-in-progress: false

jobs:
  outcome-tracker:
    runs-on: ubuntu-latest

    env:
      ENABLE_PAPER_EXECUTION: "false"
      LIVE_TRADING_CONFIRMED: "false"
      TRADING_MODE: paper
      # Alpaca keys are NOT required — reads local artifacts only.
      # If fresh position/account data is needed, run data-refresh first.

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Safety preflight
        run: |
          if [ "$ENABLE_PAPER_EXECUTION" = "true" ]; then
            echo "::error::ENABLE_PAPER_EXECUTION must not be true in outcome-tracker workflow"
            exit 1
          fi
          if [ "$LIVE_TRADING_CONFIRMED" = "true" ]; then
            echo "::error::LIVE_TRADING_CONFIRMED must not be true"
            exit 1
          fi
          echo "Safety preflight passed: ENABLE_PAPER_EXECUTION=false LIVE_TRADING_CONFIRMED=false"

      - name: Run outcome tracker
        run: python scripts/track_outcomes.py

      - name: Commit outcome artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Git status before staging:"
          git status --short

          git add -A data/latest/outcome_snapshot.json \
                     data/history/outcomes \
                     memory/TRADE-LOG.md \
                     memory/EXPERIMENT-LOG.md

          echo "Git status after staging:"
          git status --short

          if git diff --cached --quiet; then
            echo "No outcome artifacts changed."
          else
            git commit -m "research: outcome tracker run=${{ github.run_id }}"
          fi

          git pull --rebase --autostash origin main
          git push
