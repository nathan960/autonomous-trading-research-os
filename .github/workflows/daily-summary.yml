name: Daily Summary (Research Only)

# Research-only daily summary.
# Reads data/latest and data/history artifacts; writes a human-readable
# summary to memory/DAILY-SUMMARY.md and data/history/runs/.
#
# Safety invariants hardcoded in this workflow:
#   ENABLE_PAPER_EXECUTION=false  — execution is never possible from this path
#   LIVE_TRADING_CONFIRMED=false  — live trading is never confirmed here
#   execute_paper.py is never called
#   trade plans are never approved

on:
  workflow_dispatch:
    inputs:
      date:
        description: >
          Date to summarise (YYYY-MM-DD). Leave blank for today.
        required: false
        type: string
        default: ""
  schedule:
    # Weekdays at 21:00 UTC (after US market close + monitoring).
    - cron: "0 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: trading-os-main
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest

    env:
      ENABLE_PAPER_EXECUTION: "false"
      LIVE_TRADING_CONFIRMED: "false"
      TRADING_MODE: paper
      # No Alpaca keys needed — reads local artifacts only.

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Safety preflight
        run: |
          if [ "$ENABLE_PAPER_EXECUTION" = "true" ]; then
            echo "::error::ENABLE_PAPER_EXECUTION must not be true in daily-summary workflow"
            exit 1
          fi
          if [ "$LIVE_TRADING_CONFIRMED" = "true" ]; then
            echo "::error::LIVE_TRADING_CONFIRMED must not be true"
            exit 1
          fi
          echo "Safety preflight passed: ENABLE_PAPER_EXECUTION=false LIVE_TRADING_CONFIRMED=false"

      - name: Run daily summary
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python scripts/daily_summary.py --date "${{ inputs.date }}"
          else
            python scripts/daily_summary.py
          fi

      - name: Commit event files (conflict-free)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/history/events/
          if git diff --cached --quiet; then
            echo "No event files to commit."
          else
            git commit -m "chore(events): daily-summary ${{ github.run_id }}"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Commit remaining summary artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Git status before staging:"
          git status --short

          git add -A data/history/runs memory/DAILY-SUMMARY.md

          echo "Git status after staging:"
          git status --short

          if git diff --cached --quiet; then
            echo "No remaining summary artifacts changed."
            exit 0
          fi

          git commit -m "research: daily summary run=${{ github.run_id }}"

          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            echo "::warning::Markdown conflict during rebase. Event JSON files already pushed. Run rebuild_memory_logs.py to regenerate memory logs."
            exit 1
          fi
          git push
