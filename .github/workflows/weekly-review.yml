name: Weekly Review (Research Only)

# Research-only weekly review.
# Aggregates the last 7 days of history artifacts; writes to
# memory/WEEKLY-REVIEW.md, memory/EXPERIMENT-LOG.md, and data/history/runs/.
#
# Safety invariants hardcoded in this workflow:
#   ENABLE_PAPER_EXECUTION=false  — execution is never possible from this path
#   LIVE_TRADING_CONFIRMED=false  — live trading is never confirmed here
#   execute_paper.py is never called
#   config/strategy.json and risk_limits.json are never modified

on:
  workflow_dispatch:
    inputs:
      date:
        description: >
          End date of the 7-day review window (YYYY-MM-DD). Leave blank for today.
        required: false
        type: string
        default: ""
      days:
        description: >
          Number of days to look back (default 7).
        required: false
        type: string
        default: "7"
  schedule:
    # Fridays at 21:30 UTC (after US market close).
    - cron: "30 21 * * 5"

permissions:
  contents: write

concurrency:
  group: trading-os-main
  cancel-in-progress: false

jobs:
  weekly-review:
    runs-on: ubuntu-latest

    env:
      ENABLE_PAPER_EXECUTION: "false"
      LIVE_TRADING_CONFIRMED: "false"
      TRADING_MODE: paper
      # No Alpaca keys needed — reads local artifacts only.

    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Safety preflight
        run: |
          if [ "$ENABLE_PAPER_EXECUTION" = "true" ]; then
            echo "::error::ENABLE_PAPER_EXECUTION must not be true in weekly-review workflow"
            exit 1
          fi
          if [ "$LIVE_TRADING_CONFIRMED" = "true" ]; then
            echo "::error::LIVE_TRADING_CONFIRMED must not be true"
            exit 1
          fi
          echo "Safety preflight passed: ENABLE_PAPER_EXECUTION=false LIVE_TRADING_CONFIRMED=false"

      - name: Run weekly review
        run: |
          DATE_ARG=""
          DAYS_ARG=""
          if [ -n "${{ inputs.date }}" ]; then
            DATE_ARG="--date ${{ inputs.date }}"
          fi
          if [ -n "${{ inputs.days }}" ] && [ "${{ inputs.days }}" != "7" ]; then
            DAYS_ARG="--days ${{ inputs.days }}"
          fi
          python scripts/weekly_review.py $DATE_ARG $DAYS_ARG

      - name: Commit event files (conflict-free)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/history/events/
          if git diff --cached --quiet; then
            echo "No event files to commit."
          else
            git commit -m "chore(events): weekly-review ${{ github.run_id }}"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Commit remaining review artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Git status before staging:"
          git status --short

          git add -A data/history/runs memory/WEEKLY-REVIEW.md memory/EXPERIMENT-LOG.md

          echo "Git status after staging:"
          git status --short

          if git diff --cached --quiet; then
            echo "No remaining review artifacts changed."
            exit 0
          fi

          git commit -m "research: weekly review run=${{ github.run_id }}"

          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            echo "::warning::Markdown conflict during rebase. Event JSON files already pushed. Run rebuild_memory_logs.py to regenerate memory logs."
            exit 1
          fi
          git push
